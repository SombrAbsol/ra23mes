name: Linux Nightly

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  TARGET-RA2: ra2mes
  TARGET-RA3: ra3mes

jobs:
  build:
    name: Build Linux nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y --no-install-recommends \
            clang \
            make

      - name: Build Linux binaries
        run: |
          set -euo pipefail
          make CC=clang

      - name: Upload ${{ env.TARGET-RA2 }} Linux build artefact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TARGET-RA2 }}-linux
          path: |
            build/${{ env.TARGET-RA2 }}
            LICENSE
          if-no-files-found: error

      - name: Upload ${{ env.TARGET-RA3 }} Linux build artefact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TARGET-RA3 }}-linux
          path: |
            build/${{ env.TARGET-RA3 }}
            LICENSE
          if-no-files-found: error
